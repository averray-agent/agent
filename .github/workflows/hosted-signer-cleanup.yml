name: Hosted Signer Cleanup

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Stop only the backend and execute a reviewed cleanup plan. False is read-only.
        type: boolean
        required: true
        default: false
      expected_plan_hash:
        description: SHA-256 from a fresh hosted dry-run, gated by Claude
        type: string
        default: ""
      confirm:
        description: CLEANUP followed by the first 12 characters of the reviewed hash
        type: string
        default: ""

permissions:
  contents: read

# Shared with every hosted signer user and production deploy (plus VPS flock).
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_USER: ${{ secrets.VPS_USER }}
      CLEANUP_COMMIT: ${{ inputs.commit && '1' || '0' }}
      CLEANUP_PLAN_HASH: ${{ inputs.expected_plan_hash }}
      CLEANUP_CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Load prod-ci SSH key
        uses: 1password/load-secrets-action@92467eb28f72e8255933372f1e0707c567ce2259 # v4.0.0
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_PROD_CI }}
          VPS_SSH_KEY_OP: op://prod-ci/vps-ssh-key/private key
      - name: Configure SSH
        run: |
          set -euo pipefail
          set +x
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          case "$VPS_SSH_KEY_OP" in
            -----BEGIN*PRIVATE\ KEY-----*) ;;
            *) echo '::error::SSH key shape invalid'; exit 1 ;;
          esac
          mkdir -p ~/.ssh artifacts
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY_OP" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Run reviewed cleanup with host maintenance boundary
        run: |
          set -euo pipefail
          remote_env=$(printf 'CLEANUP_RUN_ID=%q CLEANUP_COMMIT=%q CLEANUP_PLAN_HASH=%q CLEANUP_CONFIRM=%q ' \
            "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$CLEANUP_COMMIT" "$CLEANUP_PLAN_HASH" "$CLEANUP_CONFIRM")
          ssh -p "${VPS_PORT:-22}" -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "${remote_env} bash /srv/agent-stack/app/scripts/ops/run-signer-cleanup-host.sh" \
            2>&1 | tee "artifacts/signer-cleanup-${GITHUB_RUN_ID}.log"
      - name: Independently restart backend and verify health
        if: ${{ always() && inputs.commit }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          mkdir -p artifacts
          remote_env=$(printf 'CLEANUP_RUN_ID=%q CLEANUP_COMMIT=1 ' "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")
          ssh -p "${VPS_PORT:-22}" -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$VPS_USER@$VPS_HOST" \
            "${remote_env} bash /srv/agent-stack/app/scripts/ops/run-signer-cleanup-host.sh --recover" \
            2>&1 | tee -a "artifacts/signer-cleanup-${GITHUB_RUN_ID}.log"
      - name: Evidence summary
        if: always()
        run: |
          {
            echo '## Hosted Signer Cleanup'
            echo "Commit requested: $CLEANUP_COMMIT"
            echo 'Full row plans, transaction evidence, stop/start times, nonces and health result are in the evidence artifact.'
            echo 'A failed cleanup or recovery requires operator review; never blindly rerun.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: signer-cleanup-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/signer-cleanup-${{ github.run_id }}.log
          if-no-files-found: error
          retention-days: 90
