name: CI

on:
  push:
    branches: [main]

  # No `branches:` filter here, on purpose. It used to say `branches: [main]`,
  # which meant a STACKED pull request — one opened with `--base` pointing at
  # another feature branch — matched no trigger at all and got zero checks.
  # `gh pr checks` then reports "no checks reported on the branch", which reads
  # like a tooling glitch rather than "nothing about this has been verified".
  # PR #1016 (2026-08-10) sat in exactly that state.
  #
  # `edited` is in the type list because GitHub retargets a stacked PR's base to
  # main automatically when the parent merges, and that arrives as
  # `pull_request` / `edited` — NOT `synchronize`, and `edited` is not in the
  # default type set. Without it the retarget starts no run, so the head SHA
  # keeps check results that were computed against the OLD base while the PR
  # claims to target main. On #1016 the only thing that re-ran CI was the
  # rebase forced by `mergeStateStatus: BEHIND`; that is luck, not a gate.
  #
  # `edited` also fires on title and body edits, so a cosmetic edit re-runs the
  # full suite. That waste is deliberate. The obvious guard — an `if:` on each
  # job so cosmetic edits skip the work — would be worse than the waste: branch
  # protection counts a `skipped` required check as a PASS, and a second run on
  # the same head SHA supersedes the first run's check runs. A guarded run would
  # therefore convert a genuinely-tested PR into a green-but-untested one, which
  # is the exact failure class this trigger block exists to close. This repo is
  # public, so GitHub-hosted runner minutes are free; the trade is one-sided.
  pull_request:
    types: [opened, synchronize, reopened, edited]

  merge_group:

# Cancel in-progress runs for the same ref when a new push lands — avoids
# wasting CI minutes on commits that are already obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Phase 4c: default to least privilege. None of the CI jobs publish
# artifacts, write to the repo, or comment on PRs — they only check
# out code and run tests/lints. Jobs that need more must elevate
# explicitly via a per-job `permissions:` block.
permissions:
  contents: read

jobs:
  generated-output-guard:
    name: Generated output guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Verify committed discovery mirrors
        run: npm run check:discovery-manifest

      - name: Reject accidental generated deploy output edits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            node scripts/ops/check-generated-output-clean.mjs --last-commit
          else
            node scripts/ops/check-generated-output-clean.mjs --range "$BASE_SHA..HEAD"
          fi

  solidity:
    name: Solidity — forge test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Install Foundry
        # Phase 2 PR 2.9 follow-up: pinned to commit SHA (not moving @v1
        # tag) so a compromised future foundry-rs release can't silently
        # retarget our CI. To refresh: re-run
        #   gh api repos/foundry-rs/foundry-toolchain/git/refs/tags/v1 --jq '.object.sha'
        # and verify the new SHA against the foundry-rs release notes
        # before updating.
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
        with:
          # Pinned (was "stable"): forge 1.7.1 is the toolchain that
          # reproduces the D-03 pinned EscrowCore v3 masked runtime hash.
          # Local green implies CI green only under toolchain parity — run
          # the same version locally before trusting a local suite result.
          version: v1.7.1
      - name: Print toolchain (parity check against local)
        run: forge --version

      - name: forge build
        run: forge build --sizes

      - name: forge test
        run: forge test -vv

  backend:
    name: Backend — node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        # This is an npm workspace monorepo, so the root package-lock.json
        # resolves both mcp-server and indexer. `npm ci` enforces the lock.
        run: npm ci

      - name: Backend local suite (unit + HTTP smoke)
        run: npm test --workspace mcp-server

      - name: Ops script regression tests
        run: npm run test:ops

      - name: Discovery manifest sync check
        run: npm run check:discovery-manifest

      - name: Job schema docs sync check
        run: npm run check:job-schemas

      - name: Verify real fixture inside backend, runner, and proxy images
        run: |
          set -euo pipefail
          export WITNESS_RUNTIME_ROOT="$RUNNER_TEMP/averray-witness-runtime"
          mkdir -p "$WITNESS_RUNTIME_ROOT"
          chmod 0777 "$WITNESS_RUNTIME_ROOT"
          cleanup() {
            docker compose -f deploy/docker-compose.verify-smoke.yml down -v --remove-orphans
          }
          trap cleanup EXIT
          docker build \
            -t averray-witness-preflight:phase1-uv-0.12.5-python-3.12.12-uv-build-0.9.27 \
            witness/sandbox
          docker compose -f deploy/docker-compose.verify-smoke.yml \
            up -d --build verify-smoke-redis verify-smoke-proxy
          docker compose -f deploy/docker-compose.verify-smoke.yml \
            run --rm verify-smoke-proxy-guard
          docker compose -f deploy/docker-compose.verify-smoke.yml \
            up --build --abort-on-container-exit \
            --exit-code-from verify-smoke-backend \
            verify-smoke-backend verify-smoke-runner

  frontend:
    name: Operator app — static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:app

      - name: Build static operator export
        run: npm run build:frontend

  public-site:
    name: Public site — static export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Build public site and prove discovery regeneration
        run: |
          printf '{"protocols":["http"]}\n' > site/.well-known/agent-tools.json
          npm run build:site
          npm run check:discovery-manifest

  indexer:
    name: Indexer — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:indexer

  env-template-structure:
    name: Phase 2 — env template structural lint
    runs-on: ubuntu-latest
    # Structural check only: validates that every op:// reference in
    # deploy/*.env.template matches a row in deploy/secrets-inventory.md,
    # uses a known vault, and is read by a service-account that has access.
    # Does NOT call `op inject` — that requires a real 1Password session
    # and lands in PR 2.1 once the CI service-account token is wired up.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      # Phase 4d (PR #287 hotfix): the calendar check below needs
      # `js-yaml` from node_modules, so we now have to install deps
      # here. Earlier sibling checks (structural lint, manifest parity,
      # install-script allowlist) use only Node stdlib and didn't
      # require an install — that's why this job historically had no
      # `npm ci`. Cost: ~30s install vs. ~12s before; calendar coverage
      # is worth it.
      - name: Install workspace dependencies
        run: npm ci

      - name: Structural lint
        run: node scripts/ops/check-env-template-structure.mjs

      # H1 (THREAT_MODEL "Boot-Time Credential-Check Bypass" follow-up): fail
      # closed if an emergency-bypass env flag (JWT_KMS_CREDENTIAL_CHECK_SKIP and
      # friends) is committed *enabled* in any env template. A clean template can't
      # render a dirty /run/agent-stack/backend.env, so this catches the accident
      # at PR time — earlier than the backend's boot-time guard.
      - name: Forbidden production env-flag guard
        run: node scripts/ops/check-forbidden-prod-env.mjs

      # Phase 2 PR 2.6: enforce that deploy/backend.env.template matches
      # the settlement values derived from deployments/testnet.json. Before
      # this guard, the runtime configure_settlement_env in
      # scripts/ops/deploy-production.sh would silently paper over drift
      # by overwriting /srv/backend.env on every deploy. That function is
      # retired in PR 2.6 — drift now needs to be caught at CI time.
      - name: Template matches manifest (settlement values)
        run: node scripts/ops/check-template-matches-manifest.mjs

      # PR #929 follow-up. The mainnet env templates are GENERATED from the
      # testnet ones by render-mainnet-backend-env.mjs, whose header has always
      # claimed "CI runs `--check` and fails if this file is stale". Nothing
      # ran it. The sibling checks above cover structure and settlement parity,
      # and check-generated-output-clean.mjs guards only frontend/ and site/ —
      # so a hand-edit to a file headed DO NOT hand-edit sat on main unnoticed
      # until someone happened to run the generator.
      #
      # It is not cosmetic drift — but it is not silent either, and the honest
      # reason for this step is WHERE the failure lands rather than whether it
      # lands at all. The eight BANK_LANE_FEED_* values existed ONLY in the
      # generated file, so a regeneration blanks six of them, and
      # bank-lane-feed.test.js (which reads that template and cross-checks it
      # against deployments/mainnet.json) then fails with
      # "BANK_LANE_FEED_HYDRATION_ACCOUNT_ID32 is required".
      #
      # That sends the reader to the config loader for a problem that lives in
      # a template generator. This step fails at the source and names both the
      # stale file and the command that fixes it.
      #
      # One invocation covers everything the generator writes: both mainnet
      # templates and the generated block of deploy/secrets-inventory.md.
      - name: Mainnet env templates are freshly generated
        run: node scripts/ops/render-mainnet-backend-env.mjs --check

      # Phase 2 PR 2.9: npm install-script supply-chain guard.
      # Scans package-lock.json for transitive deps with
      # `hasInstallScript: true` and fails if any are not in the
      # allowlist at deploy/npm-install-scripts-allowlist.json.
      # Pre-empts the Mini Shai-Hulud (Sep 2026) attack shape:
      # compromised transitive dep silently pulled into lockfile,
      # executes attacker-controlled code with the runner's full
      # secret access at install time. Our own package.json files
      # have ZERO lifecycle scripts (verified at PR 2.9 build);
      # this guard covers transitive deps.
      - name: npm install-script supply-chain allowlist
        run: node scripts/ops/check-npm-install-scripts.mjs

      # Phase 4d (per SECRETS_MIGRATION.md §"Phase 4 — Hardening"):
      # warn early, fail on past-expiry. The script reads
      # docs/SECRETS_CALENDAR.yml and classifies each tracked secret
      # against now():
      #   - exit 0: all healthy or only emitting warnings (within
      #     warn_days but not yet expired)
      #   - exit 1: script error (bad YAML, missing file)
      #   - exit 2: at least one entry past expiry — fails CI
      # Warnings don't fail CI because a 7-day warning shouldn't block
      # legitimate work, but they DO print in the run log so operators
      # see them on every push and can plan rotations. `TBD` entries
      # are treated as past-due aggressively until set — the unrotated
      # vendor secrets (Pimlico, Subscan, etc.) are surfaced here so
      # they don't get forgotten. To temporarily silence one, set
      # warn_days higher or mark it `expires_at: "never"` with a
      # justification.
      - name: Secrets calendar expiry check
        run: node scripts/ops/check-secrets-calendar.mjs

  # Phase 4a (per docs/SECRETS_MIGRATION.md §"Phase 4 — Hardening" §4a):
  # last-resort secret scan. Three layers of defense:
  #   1. Local pre-commit hook (.githooks/pre-commit) — catches the
  #      common case before push. Operator must run scripts/install-hooks.sh
  #      once after cloning.
  #   2. GitHub Secret Scanning push protection (enabled at the repo
  #      level in Settings → Security → Secret scanning) — blocks the
  #      push at the server side regardless of local hooks.
  #   3. This job — runs on every PR and every push to main. Uses our
  #      explicit ruleset at `.gitleaks.toml` (NOT gitleaks's default
  #      rules; those false-positive on bytes32 test fixtures).
  # The job is intentionally separate from env-template-structure so
  # it can use fetch-depth: 0 for full-history scans without slowing
  # the other lints.
  ai-instruction-integrity:
    # Supply-chain hygiene gate (TrapDoor-class defense). Lints AI-
    # instruction files (AGENTS.md, docs/*.md, plus any tracked
    # CLAUDE.md / .cursorrules) for zero-width Unicode codepoints, the
    # signature persistence vector used by the npm/PyPI/Crates malware
    # campaign Socket disclosed on 2026-05-24
    # (https://socket.dev/blog/trapdoor-crypto-stealer-npm-pypi-crates).
    # The lint is a single node:test script with no network deps and
    # runs in <1s; making it a required check ensures any compromised
    # package that tries to graft hidden instructions into the repo's
    # AI-assistant guides fails CI before merge.
    name: AI-instruction integrity (zero-width Unicode lint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"

      - name: Run AI-instruction integrity lint
        run: node scripts/ops/check-ai-instruction-integrity.mjs

      - name: Run lint unit tests
        run: node --test scripts/ops/check-ai-instruction-integrity.test.mjs

  secrets-scan:
    name: Phase 4a — gitleaks scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: "8.30.1"
      # Published in gitleaks_8.30.1_checksums.txt. This binds both a
      # freshly downloaded archive and a restored cache entry to the release
      # we reviewed; a cache hit is not trusted merely because it has our key.
      GITLEAKS_TARBALL_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # gitleaks-action wants the full history to scan new commits
          # against base; default fetch-depth=1 would miss everything
          # except the latest commit.
          fetch-depth: 0

      # We deliberately install the gitleaks BINARY rather than using
      # gitleaks/gitleaks-action. As of v2.x the official Action requires
      # a paid GITLEAKS_LICENSE secret for org-owned repos (the wrapper
      # was monetized; the binary is still MIT). Pinning the release
      # version makes a compromised future release no worse than what's
      # already in our supply chain. The versioned archive is cached so an
      # intermittent GitHub release-CDN failure cannot red main after the
      # reviewed artifact has been fetched once. To refresh:
      #   tag=$(gh api repos/gitleaks/gitleaks/releases/latest --jq .tag_name)
      # and update GITLEAKS_VERSION + the checksum above.
      - name: Restore pinned gitleaks release
        id: gitleaks-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.tool_cache }}/gitleaks/v${{ env.GITLEAKS_VERSION }}/${{ runner.arch }}
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-v${{ env.GITLEAKS_VERSION }}-${{ env.GITLEAKS_TARBALL_SHA256 }}

      - name: Install gitleaks
        run: |
          set -euo pipefail
          if [ "$RUNNER_ARCH" != "X64" ]; then
            echo "::error::Unsupported gitleaks runner architecture: $RUNNER_ARCH"
            exit 1
          fi

          cache_dir="${RUNNER_TOOL_CACHE}/gitleaks/v${GITLEAKS_VERSION}/${RUNNER_ARCH}"
          archive="${cache_dir}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          mkdir -p "$cache_dir"

          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          if [ "${{ steps.gitleaks-cache.outputs.cache-hit }}" != "true" ]; then
            # The CDN is now a cache-fill dependency, not an every-run
            # dependency. Retries make the one cold fetch tolerant of the
            # transient 503/TLS failures observed on 2026-08-12.
            curl -fsSL \
              --retry 4 \
              --retry-all-errors \
              --retry-delay 2 \
              --connect-timeout 20 \
              --max-time 60 \
              "$url" \
              -o "$archive"
          fi

          # Verify size sanity (~3-7 MB tarball; anything wildly off is a red flag).
          size=$(wc -c <"$archive")
          if [ "$size" -lt 1000000 ] || [ "$size" -gt 20000000 ]; then
            echo "::error::gitleaks tarball size unexpected: $size bytes"
            exit 1
          fi

          # Check every run, including cache hits. Re-extract from that verified
          # archive so the executable itself cannot silently outlive its proof.
          printf '%s  %s\n' "$GITLEAKS_TARBALL_SHA256" "$archive" | sha256sum --check
          rm -f "$cache_dir/gitleaks"
          tar -xzf "$archive" -C "$cache_dir" gitleaks
          chmod 0755 "$cache_dir/gitleaks"
          actual_version=$("$cache_dir/gitleaks" version)
          if [ "$actual_version" != "$GITLEAKS_VERSION" ]; then
            echo "::error::gitleaks version mismatch: expected $GITLEAKS_VERSION, got $actual_version"
            exit 1
          fi
          echo "$cache_dir" >> "$GITHUB_PATH"

      - name: Run gitleaks against new commits in this event
        env:
          # On a PR event, scan base..head (the PR's own diff).
          # On a push event, scan event.before..HEAD (the new commits).
          # This focuses on FUTURE leaks instead of re-flagging historical
          # text we can't un-commit — for example, shape-check comments
          # in deploy-production.yml's SSH-validation step that quote
          # PEM header markers as string assertions (the marker text
          # appears as a literal in the case statement; not a real key).
          # The pre-commit hook + GitHub push protection cover the
          # first-leak case before merge; CI is the last-resort sweep
          # on what's being added.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          set -euo pipefail

          # Resolve the log range. Fall back to scanning just HEAD if the
          # base SHA is missing (first push to a new branch, etc.).
          if [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            log_opts="-1"
            echo "No base SHA available; scanning HEAD commit only."
          else
            log_opts="$BASE_SHA..HEAD"
            echo "Scanning commits in range $log_opts"
          fi

          # --redact masks matched values in the log so we don't compound
          # a leak with public CI output.
          # --config keeps our explicit ruleset active (default rules off).
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="$log_opts" \
            --redact \
            --no-banner \
            --verbose

  # The single roll-up gate. Fans in every job above and is the one context
  # branch protection should require on main. It does two things the seven
  # individually-required contexts could not:
  #
  #   1. It closes the "required contexts drift from the job list" gap. Before
  #      this job existed, `main` required 7 contexts while this workflow
  #      defined 9 jobs — "Generated output guard" and the AI-instruction
  #      integrity lint could fail without blocking a merge, because nobody
  #      added them to the protection rule when they landed. Anything added to
  #      `needs:` below is covered from its first run, with no settings change.
  #
  #   2. It makes "no checks ran" impossible to read as "checks passed". If the
  #      workflow does not trigger at all, this context never reports, and the
  #      PR sits at "Expected — waiting for status to be reported" with merge
  #      blocked, instead of quietly showing an empty check list.
  #
  # `skipped` is treated as a failure, not a pass. That is the opposite of
  # GitHub's own default for required checks, and it is the point: a required
  # job that did not run has not verified anything. None of the jobs below have
  # an `if:`, so a skip here means something upstream went wrong and should be
  # looked at rather than merged past.
  ci-complete:
    name: CI — all checks complete
    if: always()
    needs:
      - generated-output-guard
      - solidity
      - backend
      - frontend
      - public-site
      - indexer
      - env-template-structure
      - ai-instruction-integrity
      - secrets-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every CI job to have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail

          echo "Result of every job this gate fans in:"
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "  \(.value.result)\t\(.key)"' | sort

          not_passed=$(printf '%s' "$NEEDS" \
            | jq -r '[to_entries[] | select(.value.result != "success") | "\(.key) (\(.value.result))"] | join(", ")')

          if [ -n "$not_passed" ]; then
            echo "::error::CI did not fully pass. Not in a success state: ${not_passed}"
            exit 1
          fi

          echo "All CI jobs succeeded."
