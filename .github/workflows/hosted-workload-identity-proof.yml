name: Hosted Workload Identity Proof

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: hosted-workload-identity-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Validate broker prerequisites
        id: preflight
        shell: bash
        env:
          OP_WORKLOAD_ID: ${{ vars.OP_WORKLOAD_ID }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          OP_INTEGRATION_KEY: ${{ secrets.OP_INTEGRATION_KEY }}
        run: |
          set -euo pipefail
          set +x
          missing=0
          for name in OP_WORKLOAD_ID OP_ENVIRONMENT_ID OP_INTEGRATION_KEY; do
            if [ -z "${!name:-}" ]; then
              printf '::error::Missing %s\n' "$name" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Load brokered SSH key
        id: load
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_WORKLOAD_ID: ${{ vars.OP_WORKLOAD_ID }}
          OP_ENVIRONMENT_ID: ${{ vars.OP_ENVIRONMENT_ID }}
          OP_INTEGRATION_KEY: ${{ secrets.OP_INTEGRATION_KEY }}

      - name: Validate SSH key shape and configure SSH
        id: key
        shell: bash
        env:
          VPS_SSH_KEY_B64: ${{ steps.load.outputs.VPS_SSH_KEY_B64 }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "${VPS_SSH_KEY_B64:-}" ]; then
            echo '::error::VPS_SSH_KEY_B64 is empty after load step' >&2
            exit 1
          fi
          umask 077
          key_path="$RUNNER_TEMP/workload-identity.key"
          : > "$key_path"
          chmod 600 "$key_path"
          if ! printf '%s' "$VPS_SSH_KEY_B64" | base64 -d > "$key_path" 2>/dev/null; then
            echo '::error::VPS_SSH_KEY_B64 is not valid base64' >&2
            exit 1
          fi
          # Check decoded bytes, never the Environment's single-line encoding.
          # Same OpenSSH/PEM shape check as deploy-production.yml.
          first_line=
          IFS= read -r first_line < "$key_path" || true
          case "$first_line" in
            -----BEGIN*PRIVATE\ KEY-----*) ;;
            *)
              decoded_bytes=$(wc -c < "$key_path" | tr -d '[:space:]')
              decoded_lines=$(wc -l < "$key_path" | tr -d '[:space:]')
              prefix_dashes=false
              case "$first_line" in -----*) prefix_dashes=true ;; esac
              printf '::error::Decoded SSH key shape invalid (bytes=%s, lines=%s, prefix_dashes=%s)\n' \
                "$decoded_bytes" "$decoded_lines" "$prefix_dashes" >&2
              exit 1
              ;;
          esac

      - name: Prove brokered SSH access
        id: ssh
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          set +x
          if [ -z "${VPS_HOST:-}" ]; then
            echo '::error::Missing VPS_HOST' >&2
            exit 1
          fi
          ssh -i "$RUNNER_TEMP/workload-identity.key" \
            -o IdentitiesOnly=yes -o ConnectTimeout=20 \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            "ubuntu@$VPS_HOST" 'echo workload-identity-ok'

      - name: Remove runner key
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f -- "$RUNNER_TEMP/workload-identity.key"

      - name: Summarize drill
        if: always()
        shell: bash
        env:
          PREFLIGHT: ${{ steps.preflight.outcome }}
          LOAD: ${{ steps.load.outcome }}
          KEY: ${{ steps.key.outcome }}
          SSH: ${{ steps.ssh.outcome }}
          CLEANUP: ${{ steps.cleanup.outcome }}
        run: |
          set -euo pipefail
          set +x
          for step in PREFLIGHT LOAD KEY SSH CLEANUP; do
            result=fail
            if [ "${!step:-}" = success ]; then
              result=pass
            fi
            printf '%s: %s\n' "$step" "$result" >> "$GITHUB_STEP_SUMMARY"
          done
